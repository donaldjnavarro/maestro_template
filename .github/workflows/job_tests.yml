name: Maestro tests

on:
  workflow_call:
    inputs:
      env_file:
        required: false
        type: string

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Launch emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel
          emulator-options: "-no-window -noaudio -no-boot-anim -gpu off -no-snapshot"
          disable-animations: true
          script: |
            boot_completed=""
            attempts=0
            until [[ "$boot_completed" == "1" || $attempts -ge 30 ]]; do
              sleep 10
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              echo "sys.boot_completed=$boot_completed"
              attempts=$((attempts + 1))
            done
            if [[ "$boot_completed" != "1" ]]; then
              echo "Emulator failed to boot"
              exit 1
            fi


      - name: Run Maestro tests
        run: |
          adb devices
          adb install samples/wikipedia.apk
          maestro test samples/android-advanced-flow.yaml
